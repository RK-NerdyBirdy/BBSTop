name: Backend

# Tests every backend change; on main, deploys to Render once the tests pass.
on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: # "Run workflow" button: test and redeploy main by hand

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bbstop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bbstop_test
      CGPA_TOL: "0.2"
      JWT_SECRET_KEY: ci-only-secret
      SESSION_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bbstop_migrations
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE bbstop_migrations"
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      HEALTH_URL: https://bbstop.maneetgupta.me/health
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set. Add the Render deploy hook URL under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Deploy exactly the commit that passed the tests
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}" -o /dev/null
          echo "Deploy of ${GITHUB_SHA::7} requested"

      - name: Wait until the new commit is live
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            live=$(curl -fsS "$HEALTH_URL" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit") or "")' || true)
            if [ "$live" = "$want" ]; then
              echo "Live: $want"
              exit 0
            fi
            echo "Waiting for $want (live: ${live:-unknown})"
            sleep 20
          done
          echo "::error::$want was not live after 20 minutes. Check the deploy in the Render dashboard."
          exit 1
